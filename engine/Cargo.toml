[package]
name = "openagora"
version = "0.3.2"
edition = "2024"
description = "OpenAgora engine: installs, runs and supervises open-source apps from the OpenAgora catalog."
license = "MIT"
repository = "https://github.com/sanjaykatta1/openagora"
rust-version = "1.85"

[[bin]]
name = "openagora"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
regex = "1"
tempfile = "3"
