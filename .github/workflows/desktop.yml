name: desktop
# Builds the OpenAgora desktop app (Electron) with the engine bundled inside:
# .dmg for macOS (Apple Silicon and Intel), .exe installer for Windows, and
# AppImage + .deb for Linux. Each release also carries the files the app's
# Update button reads: latest*.yml, Mac .zip apps, and .blockmap files.
#   - On every push to main that touches the app or engine: build and upload
#     the installers as workflow artifacts.
#   - Run by hand with a version (e.g. v0.3.0): also attach them to that
#     GitHub release, creating it if needed.
on:
  push:
    branches: [main]
    paths: ["desktop/**", "engine/**", "catalog/**", "packaging/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "engine/**", "catalog/**", "packaging/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to attach the installers to, e.g. v0.3.0"
        required: true
      publish:
        description: "Publish after verification (disable for a signing rehearsal)"
        type: boolean
        default: true
      draft:
        description: "Keep the release draft until desktop and CLI assets are verified"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin, arch: arm64 }
          - { name: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin, arch: x64 }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, builder: --win --x64 }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, builder: --linux --x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require matching engine, desktop and requested release versions
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(python3 packaging/version.py)
          if [[ -n "$REQUESTED" && "$REQUESTED" != "v$version" ]]; then
            echo 'Requested tag must match the engine and desktop versions' >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the engine
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: engine
      - name: Bundle the engine into the app
        shell: bash
        run: |
          exe=openagora; [ "${{ runner.os }}" = Windows ] && exe=openagora.exe
          cp "engine/target/${{ matrix.target }}/release/$exe" "desktop/resources/bin/$exe"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Test first-launch agent choice
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
        working-directory: desktop
      - name: Package Windows and Linux
        if: runner.os != 'macOS'
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npx electron-builder ${{ matrix.builder }} --publish never
      - name: Build and verify signed Mac desktop installer
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          MACOS_NOTARIZE: ${{ github.event_name != 'pull_request' }}
          # Electron Builder otherwise skips signing on every PR, even when
          # GitHub has supplied credentials for a same-repository branch.
          CSC_FOR_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          ARCH: ${{ matrix.arch }}
        run: packaging/macos/ci-build.sh --desktop "$ARCH"
      - name: Checksum desktop installers
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          for path in pathlib.Path('desktop/release').iterdir():
              if path.suffix in {'.dmg', '.zip', '.exe', '.AppImage', '.deb'}:
                  subprocess.run([sys.executable, 'packaging/checksums.py', str(path)], check=True)
          PY
      # The in-app updater reads latest*.yml from the release. Both Mac jobs
      # write latest-mac.yml, so name each by architecture; publish merges them.
      - name: Keep the update files
        if: runner.os == 'macOS'
        shell: bash
        run: mv desktop/release/latest-mac.yml "desktop/release/latest-mac-${{ matrix.arch }}.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAgora-${{ matrix.name }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml
            desktop/release/*.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Merge the Mac update files
        run: |
          python3 src/packaging/merge-mac-update.py latest-mac.yml latest-mac-arm64.yml latest-mac-x64.yml
          rm latest-mac-arm64.yml latest-mac-x64.yml
          ls latest.yml latest-mac.yml latest-linux.yml
      - uses: softprops/action-gh-release@v2
        with:
          draft: ${{ inputs.draft }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            *.dmg
            *.zip
            *.exe
            *.AppImage
            *.deb
            *.blockmap
            latest*.yml
            *.sha256
