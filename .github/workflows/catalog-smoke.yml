name: catalog-smoke
on:
  pull_request:
    paths: ["catalog/apps/handy/**", "engine/**", "packaging/tests/handy-linux*", ".github/workflows/catalog-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  handy-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --manifest-path engine/Cargo.toml
      - name: Test the real Handy release without FUSE
        run: |
          mkdir -p evidence
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/evidence:/evidence" \
            ubuntu:${{ matrix.ubuntu }} bash /src/packaging/tests/handy-linux-container.sh
      - name: Keep startup logs, release provenance and window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handy-ubuntu-${{ matrix.ubuntu }}
          path: evidence/
          retention-days: 7
