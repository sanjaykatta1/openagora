# One configuration for all four formats; the build script supplies these values.
name: openagora
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
release: 1
maintainer: OpenAgora contributors <sanjaykatta1@users.noreply.github.com>
description: Browse and validate the OpenAgora catalog of open-source desktop apps.
homepage: https://github.com/sanjaykatta1/openagora
license: MIT
section: utils
priority: optional
depends: []
contents:
  - src: ${PACKAGE_BINARY}
    expand: true
    dst: /usr/bin/openagora
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/licenses/openagora/LICENSE
    file_info:
      mode: 0644
