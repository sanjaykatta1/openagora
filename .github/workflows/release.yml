name: release
# Pull requests and this development branch build/test only. Publication is gated
# on every install test and requires a v* tag or an explicit publishing dispatch.
on:
  push:
    tags: ['v*']
    branches: [native-installers]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag matching engine/Cargo.toml, e.g. v0.1.0'
        required: true
      publish:
        description: 'Publish a release after all install tests pass'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(python3 packaging/version.py)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then REQUESTED="$GITHUB_REF_NAME"; fi
          if [[ -n "$REQUESTED" && "$REQUESTED" != "v$version" ]]; then
            echo 'Requested release tag must match engine/Cargo.toml' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, arch: arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: engine
      - name: Preserve existing tarball format and names
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          name="openagora-$TARGET.tar.gz"
          tar -czf "dist/$name" -C "engine/target/$TARGET/release" openagora
          python3 packaging/checksums.py "dist/$name"
      - name: Preserve existing Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = 'dist/openagora-x86_64-pc-windows-msvc.zip'
          Compress-Archive -Path engine/target/x86_64-pc-windows-msvc/release/openagora.exe -DestinationPath $name
          python packaging/checksums.py $name
          if ($LASTEXITCODE -ne 0) { throw 'Checksum generation failed' }
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install pinned nFPM
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build Linux native packages
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: packaging/linux/build.sh "$ARCH" "engine/target/$TARGET/release/openagora"
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned WiX
        if: runner.os == 'Windows'
        run: dotnet tool install wix --tool-path .tools/wix --version 4.0.6
      - name: Build Windows native installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/windows/build.ps1 -BinaryPath engine/target/x86_64-pc-windows-msvc/release/openagora.exe
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*
            dist/*.deb*
            dist/*.rpm*
            dist/*.apk*
            dist/*.pkg.tar.zst*
            dist/*.msi*
          if-no-files-found: error

  macos-package:
    needs: build
    runs-on: macos-14
    outputs:
      signed: ${{ steps.package.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*-apple-darwin
          path: downloads
          merge-multiple: true
      - name: Verify and extract both architectures
        run: |
          cd downloads
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            shasum -a 256 -c "openagora-$target.tar.gz.sha256"
            mkdir -p "../binaries/$target"
            tar -xzf "openagora-$target.tar.gz" -C "../binaries/$target"
          done
      - name: Build, sign and notarize universal package
        id: package
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: packaging/macos/ci-build.sh binaries
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: dist/*.pkg*
          if-no-files-found: error

  install-test-linux:
    needs: [build, version]
    strategy:
      fail-fast: false
      matrix:
        cpu:
          - { arch: amd64, target: x86_64-unknown-linux-musl, os: ubuntu-latest, native: x86_64 }
          - { arch: arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, native: aarch64 }
        distro:
          - { image: 'debian:stable', format: deb }
          - { image: 'ubuntu:latest', format: deb }
          - { image: 'fedora:latest', format: rpm }
          - { image: 'opensuse/tumbleweed', format: rpm }
          - { image: 'alpine:latest', format: apk }
    runs-on: ${{ matrix.cpu.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.cpu.target }}
          path: dist
      - name: Install, run and uninstall in a clean native container
        env:
          IMAGE: ${{ matrix.distro.image }}
          FORMAT: ${{ matrix.distro.format }}
          ARCH: ${{ matrix.cpu.arch }}
        run: |
          packages=(dist/*."$FORMAT")
          [[ ${#packages[@]} == 1 ]]
          packaging/tests/linux.sh "$IMAGE" "$ARCH" "${packages[0]}"

  install-test-arch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: binaries-x86_64-unknown-linux-musl
          path: dist
      - run: packaging/tests/linux.sh archlinux:latest amd64 dist/*.pkg.tar.zst

  install-test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: binaries-x86_64-pc-windows-msvc
          path: dist
      - name: Silent install and uninstall, including fresh-shell PATH checks
        shell: pwsh
        run: packaging/tests/windows.ps1 -Msi (Get-ChildItem dist/*.msi).FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-install-logs
          path: dist/test-logs

  install-test-macos:
    needs: [macos-package, version]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: dist
      - name: Verify checksum, install, run, uninstall, and assess signed package
        env:
          SIGNED: ${{ needs.macos-package.outputs.signed }}
        run: |
          (cd dist && shasum -a 256 -c ./*.sha256)
          packaging/tests/macos.sh dist/*.pkg "$SIGNED"

  install-tests:
    if: always()
    needs: [install-test-linux, install-test-arch, install-test-windows, install-test-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require every install test to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY

  publish:
    needs: [version, install-tests]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: native-macos
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
