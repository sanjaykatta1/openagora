schema = "openagora/v1"
id = "handy"
name = "Handy"
summary = "Offline speech-to-text: press a shortcut, speak, and your words are typed into whatever app you're using."
category = "utilities"
homepage = "https://handy.computer"
source = "https://github.com/cjpais/Handy"
license = "MIT"
# Windows builds exist upstream; the listing adds Windows once its silent
# install has been tested.
platforms = ["macos", "linux"]

[install]
notes = { linux = "Handy needs a desktop session and the gtk-layer-shell and EGL runtime libraries. On Ubuntu: install libgtk-layer-shell0 and libegl1 with your package manager if they are missing. On Ubuntu 26.04 (GNOME/Wayland), typing and global shortcuts require Handy’s own ydotool and desktop-shortcut setup; opening the window alone does not configure dictation. See Handy’s Source code → Linux Notes for the upstream instructions." }
provides = { macos = "{app_dir}/Handy.app", linux = "{app_dir}/Handy.AppDir/AppRun" }

[[install.steps]]
os = ["macos"]
shell = "sh"
download = { github = "cjpais/Handy", asset = { x64 = "Handy_x64.app.tar.gz", arm64 = "Handy_aarch64.app.tar.gz" } }
run = "tar -xzf '{download}' -C '{app_dir}'"

# Extract the complete AppDir once: no FUSE, root, or per-launch extraction.
# Keep AppRun and all bundled resources together.
[[install.steps]]
os = ["linux"]
shell = "sh"
download = { github = "cjpais/Handy", asset = { x64 = "Handy_*_amd64.AppImage", arm64 = "Handy_*_aarch64.AppImage" } }
run = '''
set -eu
chmod +x "$OPENAGORA_DOWNLOAD"
"$OPENAGORA_DOWNLOAD" --appimage-extract > /dev/null
mv squashfs-root Handy.AppDir
test -x Handy.AppDir/AppRun
'''

# Runs in the background with a global shortcut (Cmd+Shift+D on macOS,
# Ctrl+Shift+D elsewhere). First launch asks for microphone and accessibility
# permission. Handy has no MCP server; its `--toggle-transcription` flag could
# become an agent action later.
[run]
command = { macos = "{app_dir}/Handy.app/Contents/MacOS/Handy", linux = "{app_dir}/Handy.AppDir/AppRun" }
args = ["--start-hidden"]

[run.health]
process = true

[ui]
kind = "background"
show_args = []
