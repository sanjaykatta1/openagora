schema = "openagora/v1"
id = "hermes"
name = "Hermes"
summary = "Nous Research's personal agent with persistent memory and reusable skills."
category = "agents"
homepage = "https://hermes-agent.nousresearch.com"
source = "https://github.com/NousResearch/hermes-agent"
license = "MIT"
platforms = ["macos", "linux", "windows"]
# Keep engine removal protection for this externally managed installation.
# This role does not select the user's personal agent.
role = "agent"

[install]
provides = "hermes"

# The official installer creates a self-updating checkout under ~/.hermes with
# every extra, including the MCP support OpenAgora relies on.
# Hermes doesn't support Intel Macs: its required `cryptography` has no Intel
# Mac build, so the installer would have to compile it with Rust. Intel Macs
# run the Linux install in a container instead (see [container]).
[[install.steps]]
os = ["macos"]
arch = ["arm64"]
shell = "sh"
run = "curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o hermes-install.sh && bash hermes-install.sh --non-interactive"

[[install.steps]]
os = ["linux"]
shell = "sh"
run = "curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o hermes-install.sh && bash hermes-install.sh --non-interactive"

[[install.steps]]
os = ["windows"]
shell = "powershell"
run = "Invoke-WebRequest 'https://hermes-agent.nousresearch.com/install.ps1' -OutFile 'hermes-install.ps1'; & './hermes-install.ps1' -NonInteractive; if ($LASTEXITCODE -ne 0) { throw 'Hermes installation failed' }"

# Intel Macs: the Linux install and the dashboard run in a Linux container,
# with your home folder shared at the same path.
[container]
os = ["macos"]
arch = ["x64"]
share_home = true

[update]
run = "hermes update"

[run]
command = "hermes"
args = ["dashboard", "--host", "127.0.0.1", "--port", "{port}", "--no-open"]
port = "auto"

[run.health]
tcp = true

[ui]
kind = "web"
url = "http://127.0.0.1:{port}/"
