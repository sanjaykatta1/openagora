schema = "openagora/v1"
id = "hermes"
name = "Hermes"
summary = "Nous Research's personal agent with persistent memory and reusable skills."
category = "agents"
homepage = "https://hermes-agent.nousresearch.com"
source = "https://github.com/NousResearch/hermes-agent"
license = "MIT"
platforms = ["macos", "linux", "windows"]
# Keep engine removal protection for this externally managed installation.
# This role does not select the user's personal agent.
role = "agent"

[install]
provides = "hermes"

# The official installer creates a self-updating checkout under ~/.hermes with
# every extra, including the MCP support OpenAgora relies on.
[[install.steps]]
os = ["macos", "linux"]
shell = "sh"
run = "curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o '{app_dir}/hermes-install.sh' && bash '{app_dir}/hermes-install.sh' --non-interactive"

[[install.steps]]
os = ["windows"]
shell = "powershell"
run = "Invoke-WebRequest 'https://hermes-agent.nousresearch.com/install.ps1' -OutFile '{app_dir}/hermes-install.ps1'; & '{app_dir}/hermes-install.ps1' -NonInteractive; if ($LASTEXITCODE -ne 0) { throw 'Hermes installation failed' }"

[update]
run = "hermes update"

[run]
command = "hermes"
args = ["dashboard", "--host", "127.0.0.1", "--port", "{port}", "--no-open"]
port = "auto"

[run.health]
tcp = true

[ui]
kind = "web"
url = "http://127.0.0.1:{port}/"
