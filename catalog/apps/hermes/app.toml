schema = "openagora/v1"
id = "hermes"
name = "Hermes"
summary = "Nous Research's personal agent with persistent memory and reusable skills. Powers Sunday, OpenAgora's personal agent."
category = "agents"
homepage = "https://hermes-agent.nousresearch.com"
source = "https://github.com/NousResearch/hermes-agent"
license = "MIT"
platforms = ["macos", "linux", "windows"]
# OpenAgora's personal agent, Sunday. OpenAgora runs Hermes only under its own
# `sunday` profile, so the user's other profiles, memory and bots are never
# touched. Removing Sunday deletes that profile; Hermes itself stays.
role = "agent"
profile = "sunday"

[install]
provides = "hermes"

# The official installer creates a self-updating checkout under ~/.hermes with
# every extra, including the MCP support OpenAgora relies on. A Hermes that is
# already installed is used as it is, never reinstalled.
[[install.steps]]
os = ["macos", "linux"]
shell = "sh"
run = "curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o hermes-install.sh && bash hermes-install.sh --non-interactive"

[[install.steps]]
os = ["windows"]
shell = "powershell"
run = "Invoke-WebRequest 'https://hermes-agent.nousresearch.com/install.ps1' -OutFile 'hermes-install.ps1'; & './hermes-install.ps1' -NonInteractive; if ($LASTEXITCODE -ne 0) { throw 'Hermes installation failed' }"

[update]
run = "hermes update"

# Hermes's own dashboard for Sunday's profile. `--isolated` runs a server for
# that profile alone, instead of attaching to (or becoming) the machine-wide
# dashboard the user may already run.
[run]
command = "hermes"
args = ["-p", "{profile}", "dashboard", "--isolated", "--host", "127.0.0.1", "--port", "{port}", "--no-open"]
port = "auto"

[run.health]
tcp = true

[ui]
kind = "web"
url = "http://127.0.0.1:{port}/"
